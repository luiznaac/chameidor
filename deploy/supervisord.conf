; Program definitions, included by /etc/supervisor/supervisord.conf.
; Both processes log to the container's stdout/stderr.

[program:api]
command=/opt/app/bin/application
directory=/opt/app
user=app
environment=KTOR_PORT="%(ENV_API_PORT)s"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
