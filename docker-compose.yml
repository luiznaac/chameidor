# Full stack in one command: the combined app image (Ktor backend + built SPA,
# from ./Dockerfile) plus its MySQL.
#
#   docker compose up --build                        # everything
#   docker compose -f backend/docker-compose.yml up -d mysql   # just the DB
#
# The published image (docker.io/luiznaac/chameidor) is the `app` service only —
# in production the database is a separate, externally provisioned container.
#
# The schema is NOT seeded here: backend/persistence/src/main/resources/db/migration/V*.sql is
# applied by Flyway from deploy/entrypoint.sh before the app starts.

services:
  mysql:
    image: mysql:9.4.0
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=chameidor
    ports:
      - "3306:3306"
    volumes:
      - chameidor-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: luiznaac/chameidor:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - API_PORT=8080
      - WEB_PORT=8081
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - ENQUEUE_TASKS_PERIOD=10
    ports:
      - "8080:8080"   # API      (Ktor)
      - "8081:8081"   # web / UI  (nginx: SPA + /api proxy)

volumes:
  chameidor-mysql-data:
